<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seeKazino — Mines</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="logo">
                <span class="logo-icon">🎰</span>
                <span>see<span class="logo-accent">Kazino</span></span>
            </a>
            <div class="header-right">
                <div class="balance-pill">
                    <span class="balance-icon">💰</span>
                    <span id="balanceAmount">$10.00</span>
                </div>
                <a href="index.html" class="btn btn-ghost">← В лобби</a>
            </div>
        </div>
    </header>

    <main class="main game-layout">
        <div class="crash-display">
            <div class="mines-grid" id="minesGrid"></div>
            <div class="crash-status" id="minesStatus" style="margin-top:16px;">Выбери ставку и количество мин, нажми "Старт"</div>
        </div>

        <div class="crash-controls">
            <div class="bet-section">
                <label class="form-label">Ставка</label>
                <div class="bet-input-group">
                    <button class="bet-adjust" id="betMinus">−</button>
                    <input type="number" class="form-input bet-input" id="betAmount" value="1.00" min="0.10" step="0.10">
                    <button class="bet-adjust" id="betPlus">+</button>
                </div>
            </div>

            <div class="bet-section">
                <label class="form-label">Количество мин</label>
                <div class="mines-selector">
                    <button class="preset-btn mines-opt selected" data-mines="3">3</button>
                    <button class="preset-btn mines-opt" data-mines="5">5</button>
                    <button class="preset-btn mines-opt" data-mines="10">10</button>
                    <button class="preset-btn mines-opt" data-mines="15">15</button>
                </div>
            </div>

            <div class="mines-info">
                <div class="mines-info-row"><span>Открыто:</span><span id="minesPicked">0</span></div>
                <div class="mines-info-row"><span>Множитель:</span><span id="minesMult" class="text-green">1.00x</span></div>
                <div class="mines-info-row"><span>Выигрыш:</span><span id="minesWin" class="text-green">$0.00</span></div>
            </div>

            <button class="btn btn-primary btn-full btn-large" id="startBtn">💣 Старт</button>
            <button class="btn btn-cashout btn-full btn-large" id="cashoutBtn" style="display:none;">💰 Забрать</button>
        </div>
    </main>

    <script src="js/mines.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
