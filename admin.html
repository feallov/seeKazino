<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seeKazino — Админка</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="logo"><span class="logo-icon">🎰</span><span>see<span class="logo-accent">Kazino</span></span></a>
            <div class="header-right">
                <a href="index.html" class="btn btn-ghost">← В лобби</a>
            </div>
        </div>
    </header>

    <main class="main">
        <h1 class="section-title">👑 Админ-панель</h1>

        <div class="stats-grid" style="margin-top:16px;">
            <div class="stat-card"><span class="stat-value" id="admUsers">0</span><span class="stat-label">Игроков</span></div>
            <div class="stat-card"><span class="stat-value" id="admBets">0</span><span class="stat-label">Всего ставок</span></div>
            <div class="stat-card"><span class="stat-value" id="admWagered">$0</span><span class="stat-label">Оборот</span></div>
            <div class="stat-card"><span class="stat-value" id="admBalances">$0</span><span class="stat-label">Балансов на руках</span></div>
        </div>

        <h2 class="section-title" style="margin-top:32px;">🎟️ Промокоды</h2>
        <div class="promo-create">
            <input type="text" class="form-input" id="promoCode" placeholder="КОД (напр. WELCOME)">
            <input type="number" class="form-input" id="promoAmount" placeholder="Сумма $" value="10">
            <input type="number" class="form-input" id="promoUses" placeholder="Активаций" value="10">
            <button class="btn btn-primary" id="promoCreateBtn">Создать</button>
        </div>
        <div id="promoList" class="promo-list"></div>

        <h2 class="section-title" style="margin-top:32px;">👥 Игроки</h2>
        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                    <tr><th>Ник</th><th>Баланс</th><th>Уровень</th><th>Ставок</th><th>Действия</th></tr>
                </thead>
                <tbody id="admTable"></tbody>
            </table>
        </div>
    </main>

    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
