<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seeKazino — Магазин</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="logo"><span class="logo-icon">🎰</span><span>see<span class="logo-accent">Kazino</span></span></a>
            <div class="header-right">
                <div class="balance-pill"><span class="balance-icon">💰</span><span id="balanceAmount">$10.00</span></div>
                <a href="index.html" class="btn btn-ghost">← В лобби</a>
            </div>
        </div>
    </header>

    <main class="main">
        <h1 class="section-title">🛒 Магазин</h1>
        <p class="section-sub">Трать заработанное на аватары, темы и бусты</p>

        <div class="promo-block">
            <input type="text" class="form-input" id="promoInput" placeholder="ВВЕДИ ПРОМОКОД">
            <button class="btn btn-primary" id="promoBtn">Активировать</button>
        </div>

        <div class="shop-grid" id="shopGrid"></div>
    </main>

    <script src="js/shop.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
