<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seeKazino — Dice</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="logo"><span class="logo-icon">🎰</span><span>see<span class="logo-accent">Kazino</span></span></a>
            <div class="header-right">
                <div class="balance-pill"><span class="balance-icon">💰</span><span id="balanceAmount">$10.00</span></div>
                <a href="index.html" class="btn btn-ghost">← В лобби</a>
            </div>
        </div>
    </header>

    <main class="main game-layout">
        <div class="crash-display">
            <div class="dice-result" id="diceResult">—.——</div>
            <div class="dice-scale">
                <div class="dice-winzone" id="diceWinzone"></div>
                <div class="dice-marker" id="diceMarker"></div>
            </div>
            <div class="crash-status" id="diceStatus">Двигай ползунок и жми "Бросить"</div>
        </div>

        <div class="crash-controls">
            <div class="bet-section">
                <label class="form-label">Ставка</label>
                <div class="bet-input-group">
                    <button class="bet-adjust" id="betMinus">−</button>
                    <input type="number" class="form-input bet-input" id="betAmount" value="1.00" min="0.10" step="0.10">
                    <button class="bet-adjust" id="betPlus">+</button>
                </div>
            </div>

            <div class="bet-section">
                <label class="form-label">Режим</label>
                <div class="mines-selector">
                    <button class="preset-btn dice-mode selected" data-mode="over">Выше</button>
                    <button class="preset-btn dice-mode" data-mode="under">Ниже</button>
                </div>
            </div>

            <div class="bet-section">
                <label class="form-label">Цель: <span id="targetVal" class="text-green">50.00</span></label>
                <input type="range" class="dice-slider" id="targetSlider" min="2" max="98" value="50" step="1">
            </div>

            <div class="mines-info">
                <div class="mines-info-row"><span>Шанс:</span><span id="diceChance">50%</span></div>
                <div class="mines-info-row"><span>Множитель:</span><span id="diceMult" class="text-green">1.98x</span></div>
                <div class="mines-info-row"><span>Выигрыш:</span><span id="diceWin" class="text-green">$1.98</span></div>
            </div>

            <button class="btn btn-primary btn-full btn-large" id="rollBtn">🎲 Бросить</button>
        </div>
    </main>

    <script src="js/dice.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
